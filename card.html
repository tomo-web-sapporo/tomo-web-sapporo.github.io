<style>
:root{--navy:#1F3A5F;--gold:#E8A33D;--paper:#FAF8F4;--line:#E6DED0;--ink:#1F2A36;--mute:#6B5E48}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#ECE7DE;font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;color:var(--ink);-webkit-text-size-adjust:100%}
.card{max-width:440px;min-height:100vh;margin:0 auto;background:var(--paper);display:flex;flex-direction:column}
@media(min-width:520px){body{padding:40px 16px}.card{min-height:auto;border-radius:20px;overflow:hidden;box-shadow:0 10px 40px rgba(31,58,95,.18)}}
header{background:var(--navy);padding:calc(44px + env(safe-area-inset-top)) 24px 36px;display:flex;flex-direction:column;align-items:center;gap:14px;color:#fff}
.brand{display:flex;align-items:baseline;gap:10px}
.brand .kanji{font-family:"Noto Serif JP",serif;font-weight:700;font-size:30px}
.brand .en{font-weight:700;font-size:22px;letter-spacing:.04em}
.sub{font-size:13px;color:#C9D3E0;letter-spacing:.2em}
.who{padding:28px 24px 0}
.role{font-size:13px;color:var(--mute)}
h1{margin:4px 0;font-size:30px;font-weight:700;color:var(--navy);letter-spacing:.08em}
.kana{font-size:13px;color:var(--mute);letter-spacing:.1em}
.msg{margin:20px 24px 0;padding:16px 18px;background:#fff;border:1px solid var(--line);border-radius:12px}
.msg strong{display:block;font-family:"Noto Serif JP",serif;font-weight:600;font-size:17px;color:var(--navy)}
.msg p{margin:6px 0 0;font-size:13px;line-height:1.7;color:#5A5040}
.links{padding:22px 24px 0;display:flex;flex-direction:column;gap:10px}
.links a{display:flex;align-items:center;gap:14px;min-height:52px;padding:0 18px;background:#fff;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--navy);font-size:15px;font-weight:500}
.links a span{margin-left:auto;font-size:13px;color:var(--mute);font-weight:400}
.links a:active{background:#F3EEE5}
.links a:focus-visible,.save:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.links svg{flex:none}
.links a.save{justify-content:center;gap:10px;margin-top:6px;background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
footer{margin-top:auto;padding:28px 24px calc(28px + env(safe-area-inset-bottom));text-align:center;font-size:12px;color:var(--mute)}
</style>
